/* ================= CART ================= */
let cart = [];

/* ================= URL PARAM ================= */
const params = new URLSearchParams(window.location.search);

const product = products.find(p => p.id === productId);

const container = document.getElementById("productDetail");

  container.innerHTML = `<h3 class="text-danger">Product not found</h3>`;
} else {
  container.innerHTML = `
    <div class="col-md-6 mb-4">
      <img src="${product.image}" class="img-fluid product-img rounded">
    </div>

    <div class="col-md-6">
      <h2>${product.name}</h2>
      <p class="fs-4 fw-bold">${product.price}</p>
<p class="text-muted mt-2">${product.description}</p>

      <label class="fw-bold mb-1">Quantity</label>
      <input type="number" min="1" value="1"
        id="qty-${product.id}"
        class="form-control w-50 mb-3">

      <button class="btn btn-primary btn-lg"
        onclick="addToCart(${product.id})">
        <i class="fa fa-cart-plus"></i> Add to Cart
      </button>
    </div>
  `;
}

/* ================= ADD TO CART ================= */
function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  const qty = parseInt(document.getElementById(`qty-${productId}`).value, 10);

  if (!qty || qty <= 0) return;

  const existing = cart.find(item => item.id === productId);

  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      unit: product.price,
      qty: qty
    });
  }

  updateCartCount();
}

/* ================= CART COUNT ================= */
function updateCartCount() {
  let total = 0;
  cart.forEach(item => total += item.qty);
  document.getElementById("cartCount").innerText = total;
}

/* ================= WHATSAPP CHECKOUT ================= */
function checkoutWhatsApp() {
              if (cart.length === 0) {
                alert("Cart is empty");
                return;
              }
            
              let message = "🛒 *New Order* %0A%0A";
            
              cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} , %0A`;
                message += ` ${item.unit}, %0A`;
                message += `   Qty: ${item.qty}, %0A%0A`;
              });
            
              message += "📍 Please confirm availability.";
            
              const phoneNumber = "918053588700"; // 👈 your WhatsApp number
              const url = `https://wa.me/${phoneNumber}?text=${message}`;
            
              window.open(url, "_blank");
            }
